<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- googleフォント -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=WDXL+Lubrifont+JP+N&display=swap" rel="stylesheet">
    <!-- オリジナルCSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="background">
        <div class="play-header">
            <div class="p1-area">
                <h2 id="p1name">PLAYER 1</h2>
                    <div class="HPbar">
                        <div id="p1-hp"></div>
                    </div>
            </div> 
            <div id="goal" class="goal">
                <p id="goal-time">05.00</p>
            </div>
            <div class="p2-area">
                <h2 id="p2name">PLAYER 2</h2>
                <div class="HPbar">
                    <div id="p2-hp"></div>
                </div>
            </div>
        </div>
        <div class="play-area">
            <div class="player-display">
                <div id="p1time" class="time">00.00</div>
                <img id="p1-char-img" class="character" src="img/player1.png" alt="1Pキャラ">
            </div>
            <div id="center" class="stopwatch">
                <div id="stopwatch" class="time">00.00</div>
                <button id="startbtn">スタート</button>
                <button id="stopbtn" disabled>ストップ</button>
            </div>
            <div class="player-display">
                <div id="p2time" class="time">00.00</div>
                <img id="p2-char-img" class="character" src="img/player2.png" alt="2Pキャラ">
            </div>
        </div>
    </section>
    <div class="commentarea">
        <p id="comment1"></p>
        <p id="comment2"></p>
    </div>
    
    <script>
    document.addEventListener("DOMContentLoaded", function(){
        // topから選択した写真を取得
        const p1NameData = localStorage.getItem("player1") || "PLAYER 1";
        const p2NameData = localStorage.getItem("player2") || "PLAYER 2";
        const p1ImgKey = localStorage.getItem("player1Img") || "player1";
        const p2ImgKey = localStorage.getItem("player2Img") || "player2";

        // 名前・写真書き換え
        const p1nameDisp = document.getElementById("p1name");
        const p2nameDisp = document.getElementById("p2name");
        const p1charImgDisp = document.getElementById("p1-char-img");
        const p2charImgDisp = document.getElementById("p2-char-img");

        // 名前の反映
        if (p1nameDisp) p1nameDisp.textContent = p1NameData;
        if (p2nameDisp) p2nameDisp.textContent = p2NameData;

        // 画像の組み立て➡反映
        if (p1charImgDisp) p1charImgDisp.src = "img/" + p1ImgKey + ".png";
        if (p2charImgDisp) p2charImgDisp.src = "img/" + p2ImgKey + ".png";
    });
    </script>

    <script src="main.js"></script>
</body>
</html>
