<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- googleフォント -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=WDXL+Lubrifont+JP+N&display=swap" rel="stylesheet">
    <!-- オリジナルCSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="play-header">
        <div class="p1-area">
            <h2>PLAYER 1</h2>
            <div class="HPbar">
                <div id="p1-hp"></div>
            </div>
        </div>
        <div id="goal" class="goal">
            <p id="goal-time">05.00</p>
        </div>
        <div class="p2-area">
            <h2>PLAYER 2</h2>
            <div class="HPbar">
                <div id="p2-hp"></div>
            </div>
        </div>
    </div>
    <div class="play-area">
        <div>
            <img class="character" src="img/zakosi.jpg" alt="">
            <div id="p1time" class="time">00.00</div>
        </div>
        <div id="center" class="stopwatch">
            <div id="stopwatch" class="time">00.00</div>
            <button id="startbtn">スタート</button>
            <button id="stopbtn" disabled>ストップ</button>
        </div>
        <div>
            <img class="character" src="img/go-jasu.jpg" alt="">
            <div id="p2time" class="time">00.00</div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
